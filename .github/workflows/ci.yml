name: CI
# Gates: frozen-lockfile install -> build -> typecheck -> format -> exports -> test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported LTS lines (Node 20 reached end-of-life on 2026-04-30); .nvmrc pins 22.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from root package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run check-format
      - run: pnpm run check-exports
      - run: pnpm run test
