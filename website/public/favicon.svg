<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid: centre (250,250). Ring 246/206. Stem, bar and flank bars 50 wide. Flank-to-stem gap 40. All chamfers 45°. -->
  <circle cx="250" cy="250" r="246" fill="#000"/>
  <circle cx="250" cy="250" r="206" fill="#fffafa"/>
  <!-- tau: bar 130-180 with 45° ends (top 150-350, bottom 100-400), stem 225-275 down to 405 -->
  <path fill="#000" d="M150 130H350L400 180H275V405H225V180H100Z"/>
  <!-- left flank: arm 90-185 x 225-280, bar 135-185 down to a 45° foot (340 at the outer edge, 390 at the inner) -->
  <path fill="#000" d="M90 225H185V390L135 340V280H90Z"/>
  <!-- right flank: exact mirror about x=250 -->
  <path fill="#000" d="M410 225H315V390L365 340V280H410Z"/>
</svg>
